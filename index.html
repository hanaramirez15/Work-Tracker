<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hannah's Work Tracker</title>
<!-- Include your original styles from tracker-invoice.html here -->
<style>
  /* Use the exact CSS provided in your original tracker-invoice.html file */
  :root { --bg: #0f0f13; --surface: #18181f; --surface2: #22222d; --border: #2e2e3d; --accent: #c8a96e; --text: #f0ede8; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding: 32px 20px; }
  .app { max-width: 1100px; margin: 0 auto; }
  .log-section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
  .btn-primary { background: var(--accent); color: #111; padding: 10px; border-radius: 8px; border: none; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <h1>Work Tracker</h1>
  
  <!-- Add Client Section -->
  <div class="log-section">
    <h2>Add Client</h2>
    <input type="text" id="new-client-name" placeholder="Client Name">
    <button class="btn-primary" onclick="addClient()">Add</button>
  </div>

  <!-- Hours Log -->
  <div class="log-section">
    <h2>Hours Log</h2>
    <div id="logs-list"></div>
  </div>
</div>

<script>
// Your specific data
let logs = [
  { date: '2026-05-18', client: 'Johannes', hours: 15 },
  { date: '2026-05-18', client: 'David', hours: 1 },
  { date: '2026-05-18', client: 'Will', hours: 5 },
  { date: '2026-05-18', client: 'Joe', hours: 5 },
  { date: '2026-05-25', client: 'Johannes', hours: 4 },
  { date: '2026-05-25', client: 'David', hours: 1 },
  { date: '2026-05-25', client: 'Will', hours: 6 },
  { date: '2026-05-25', client: 'Joe', hours: 4 }
];

function render() {
  document.getElementById('logs-list').innerHTML = logs.map(l => 
    `<div>${l.date} - ${l.client}: ${l.hours} hrs</div>`
  ).join('');
}

function addClient() {
  const name = document.getElementById('new-client-name').value;
  alert('Added ' + name);
}

render();
</script>
</body>
</html>
