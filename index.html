<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hannah's Work Tracker</title>
    <style>
        .client-form { background: var(--surface2); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; }
    </style>
</head>
<body>

<div class="app">
    <div class="log-section">
        <h2>Manage Clients</h2>
        <div class="client-form">
            <input type="text" id="new-client-name" placeholder="Client Name">
            <input type="number" id="new-client-rate" placeholder="Rate">
            <select id="new-client-type">
                <option value="hourly">Hourly</option>
                <option value="fixed">Fixed</option>
            </select>
            <button class="btn btn-primary" onclick="addClient()">Add Client</button>
        </div>
        <div id="client-list-mgmt"></div>
    </div>

    </div>

<script>
// Load from localStorage or use defaults
let CLIENTS = JSON.parse(localStorage.getItem('hr_clients')) || {
  David: { rate: 2000, type: 'fixed', color: 'david' },
  Will: { rate: 5, type: 'hourly', color: 'will' }
};

function saveClients() {
    localStorage.setItem('hr_clients', JSON.stringify(CLIENTS));
    location.reload(); // Refresh to update dropdowns
}

function addClient() {
    const name = document.getElementById('new-client-name').value;
    const rate = parseFloat(document.getElementById('new-client-rate').value);
    const type = document.getElementById('new-client-type').value;
    
    if(!name || !rate) return alert("Fill in name and rate");
    
    // Assign a simple color rotation
    const colors = ['david', 'will', 'joe', 'johannes'];
    const color = colors[Object.keys(CLIENTS).length % colors.length];
    
    CLIENTS[name] = { rate, type, color };
    saveClients();
}

// Update your existing render functions to use the dynamic CLIENTS object
// For example, in renderCards():
function renderCards() {
  const container = document.getElementById('client-cards');
  container.innerHTML = Object.entries(CLIENTS).map(([name, c]) => {
    // ... logic remains same as before
  }).join('');
}
</script>
</body>
</html>
