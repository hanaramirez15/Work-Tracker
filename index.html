<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        .invoice-box { border: 2px solid #333; padding: 20px; }
        .total { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Work Hour Tracker</h1>
        <table id="trackerTable">
            <thead>
                <tr>
                    <th>Client</th>
                    <th>Hours Worked</th>
                    <th>Rate ($/hr)</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Will</td><td><input type="number" class="hours" value="0" oninput="calculate()"></td><td>5</td></tr>
                <tr><td>Joe</td><td><input type="number" class="hours" value="0" oninput="calculate()"></td><td>5</td></tr>
                <tr><td>Johannes</td><td><input type="number" class="hours" value="0" oninput="calculate()"></td><td>3</td></tr>
            </tbody>
        </table>

        <div class="invoice-box">
            <h2>Invoice</h2>
            <p><strong>From:</strong> Hannah Ramirez</p>
            <p><strong>To:</strong> Mary Joy Libed</p>
            <table>
                <thead>
                    <tr><th>Item</th><th>Amount</th></tr>
                </thead>
                <tbody id="invoiceBody">
                    <tr><td>David (Fixed)</td><td>2,000 PHP</td></tr>
                    <tr><td>Will</td><td id="willTotal">$0</td></tr>
                    <tr><td>Joe</td><td id="joeTotal">$0</td></tr>
                    <tr><td>Johannes</td><td id="johannesTotal">$0</td></tr>
                    <tr class="total"><td>Total (USD)</td><td id="grandTotal">$0</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function calculate() {
            const inputs = document.querySelectorAll('.hours');
            const rates = [5, 5, 3];
            const ids = ['willTotal', 'joeTotal', 'johannesTotal'];
            let grandTotal = 0;

            inputs.forEach((input, index) => {
                const total = input.value * rates[index];
                document.getElementById(ids[index]).innerText = '$' + total;
                grandTotal += total;
            });
            document.getElementById('grandTotal').innerText = '$' + grandTotal;
        }
    </script>
</body>
</html>
