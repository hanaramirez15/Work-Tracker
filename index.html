
<h2 class="sr-only">Hannah's work tracker — weekly dashboard with history and invoice generator for Mary Joy Libed.</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.nav{display:flex;gap:2px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:3px;margin-bottom:1.5rem;}
.nav-btn{flex:1;padding:7px 10px;font-size:13px;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font-sans);}
.nav-btn.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;border:0.5px solid var(--color-border-tertiary);}
.page{display:none;}.page.active{display:block;}
.week-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;}
.week-nav{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:5px 10px;cursor:pointer;font-size:13px;color:var(--color-text-primary);font-family:var(--font-sans);}
.week-nav:hover{background:var(--color-background-primary);}
.week-title{font-size:14px;font-weight:500;color:var(--color-text-primary);}
.week-sub{font-size:12px;color:var(--color-text-secondary);text-align:center;}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1.25rem;}
.metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px;text-align:center;}
.m-name{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em;}
.m-val{font-size:20px;font-weight:500;color:var(--color-text-primary);}
.m-sub{font-size:11px;color:var(--color-text-secondary);margin-top:2px;}
.m-david{border-top:2px solid #1D9E75;}
.m-joe{border-top:2px solid #378ADD;}
.m-will{border-top:2px solid #7F77DD;}
.m-johannes{border-top:2px solid #D85A30;}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:1rem;}
.card-title{font-size:13px;font-weight:500;margin-bottom:12px;color:var(--color-text-primary);}
.row{display:flex;gap:8px;}
.row>div{flex:1;}
label{font-size:12px;color:var(--color-text-secondary);display:block;margin-bottom:3px;}
select,input{width:100%;margin-bottom:10px;font-size:13px;}
.btn{border:0.5px solid var(--color-border-secondary);background:none;border-radius:var(--border-radius-md);padding:7px 14px;font-size:13px;cursor:pointer;color:var(--color-text-primary);font-family:var(--font-sans);}
.btn:hover{background:var(--color-background-secondary);}
.btn-dark{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary);}
.btn-dark:hover{opacity:0.85;}
.log-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.log-table th{text-align:left;padding:6px 8px;font-weight:500;font-size:11px;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary);}
.log-table td{padding:6px 8px;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.log-table tr:last-child td{border-bottom:none;}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:var(--border-radius-md);}
.b-david{background:#E1F5EE;color:#085041;}
.b-joe{background:#E6F1FB;color:#0C447C;}
.b-will{background:#EEEDFE;color:#3C3489;}
.b-johannes{background:#FAECE7;color:#712B13;}
.del{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);padding:2px 5px;font-size:13px;}
.del:hover{color:#A32D2D;}
.empty{text-align:center;padding:2rem 1rem;color:var(--color-text-secondary);font-size:13px;}
.total-row{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.inv-box{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.5rem;}
.inv-table{width:100%;border-collapse:collapse;font-size:13px;margin:1rem 0;}
.inv-table th{background:var(--color-background-secondary);padding:8px 10px;text-align:left;font-size:12px;font-weight:500;color:var(--color-text-secondary);}
.inv-table td{padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);}
.inv-table tr:last-child td{border-bottom:none;}
.hist-week{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:10px;overflow:hidden;}
.hist-week-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;background:var(--color-background-secondary);}
.hist-week-body{padding:0 4px 4px;}
.msg-ok{font-size:12px;color:#3B6D11;margin-top:6px;}
.msg-err{font-size:12px;color:#A32D2D;margin-top:6px;}
</style>

<div style="padding:1rem 0 0;">

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;">
  <div>
    <div style="font-size:17px;font-weight:500;">Hannah's Work Tracker</div>
    <div style="font-size:12px;color:var(--color-text-secondary);">Employer: Mary Joy Libed</div>
  </div>
  <div style="font-size:12px;color:var(--color-text-secondary);" id="today-disp"></div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="goPage('dashboard')"><i class="ti ti-layout-dashboard" aria-hidden="true"></i> Dashboard</button>
  <button class="nav-btn" onclick="goPage('log')"><i class="ti ti-clock" aria-hidden="true"></i> Log Hours</button>
  <button class="nav-btn" onclick="goPage('history')"><i class="ti ti-history" aria-hidden="true"></i> History</button>
  <button class="nav-btn" onclick="goPage('invoice')"><i class="ti ti-file-invoice" aria-hidden="true"></i> Invoice</button>
</div>

<div id="page-dashboard" class="page active">
  <div class="week-bar">
    <button class="week-nav" onclick="shiftDash(-1)"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
    <div style="text-align:center;">
      <div class="week-title" id="dash-week-label"></div>
      <div class="week-sub" id="dash-week-range"></div>
    </div>
    <button class="week-nav" onclick="shiftDash(1)" id="dash-next"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
  </div>
  <div class="metrics">
    <div class="metric m-david"><div class="m-name">David</div><div class="m-val" id="d-david">₱0</div><div class="m-sub" id="d-david-sub">0 hrs</div></div>
    <div class="metric m-joe"><div class="m-name">Joe</div><div class="m-val" id="d-joe">$0</div><div class="m-sub" id="d-joe-sub">0 hrs</div></div>
    <div class="metric m-will"><div class="m-name">Will</div><div class="m-val" id="d-will">$0</div><div class="m-sub" id="d-will-sub">0 hrs</div></div>
    <div class="metric m-johannes"><div class="m-name">Johannes</div><div class="m-val" id="d-johannes">$0</div><div class="m-sub" id="d-johannes-sub">0 hrs</div></div>
  </div>
  <div id="dash-logs"></div>
  <div id="dash-totals"></div>
</div>

<div id="page-log" class="page">
  <div class="card">
    <div class="card-title">Add time log</div>
    <div class="row">
      <div><label>Date</label><input type="date" id="log-date"></div>
      <div><label>Client</label>
        <select id="log-client">
          <option value="David">David (₱2,000/week fixed)</option>
          <option value="Joe">Joe ($5/hr)</option>
          <option value="Will">Will ($5/hr)</option>
          <option value="Johannes">Johannes ($5/hr)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>Hours</label><input type="number" id="log-hrs" min="0.5" max="24" step="0.5" placeholder="e.g. 3.5"></div>
      <div><label>Task / description</label><input type="text" id="log-desc" placeholder="e.g. Social media management"></div>
    </div>
    <button class="btn btn-dark" onclick="addLog()"><i class="ti ti-plus" aria-hidden="true"></i> Save log</button>
    <div id="log-msg"></div>
  </div>
</div>

<div id="page-history" class="page">
  <div style="display:flex;gap:8px;margin-bottom:1rem;">
    <div style="flex:1;"><label>Client</label>
      <select id="hist-client" onchange="renderHistory()">
        <option value="all">All clients</option>
        <option value="David">David</option>
        <option value="Joe">Joe</option>
        <option value="Will">Will</option>
        <option value="Johannes">Johannes</option>
      </select>
    </div>
  </div>
  <div id="history-out"></div>
</div>

<div id="page-invoice" class="page">
  <div class="card">
    <div class="card-title">Invoice period</div>
    <div class="row">
      <div><label>From</label><input type="date" id="inv-from"></div>
      <div><label>To</label><input type="date" id="inv-to"></div>
    </div>
    <button class="btn btn-dark" onclick="generateInvoice()"><i class="ti ti-file-invoice" aria-hidden="true"></i> Generate invoice</button>
  </div>
  <div id="invoice-out"></div>
</div>

</div>

<script>
const CLIENTS={David:{rate:2000,cur:'₱',type:'fixed'},Joe:{rate:5,cur:'$',type:'hourly'},Will:{rate:5,cur:'$',type:'hourly'},Johannes:{rate:5,cur:'$',type:'hourly'}};
const KEY='hannah_logs_v2';
function getLogs(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return[];}}
function saveLogs(d){localStorage.setItem(KEY,JSON.stringify(d));}

function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtD(d){const p=d.split('-');return`${p[2]}/${p[1]}/${p[0]}`;}
function getMonday(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay();
  const mon=new Date(d);
  mon.setDate(d.getDate()-((day+6)%7));
  return mon.toISOString().slice(0,10);
}
function addDays(dateStr,n){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function weekKey(dateStr){const m=getMonday(dateStr);return m+'_'+addDays(m,6);}
function weekLabel(wk){const[a,b]=wk.split('_');return`${fmtD(a)} – ${fmtD(b)}`;}

let dashOffset=0;

function getCurrentDashWeek(){
  const base=getMonday(todayStr());
  const d=new Date(base+'T00:00:00');
  d.setDate(d.getDate()+dashOffset*7);
  const mon=d.toISOString().slice(0,10);
  const sun=addDays(mon,6);
  return{mon,sun,key:mon+'_'+sun};
}

function shiftDash(dir){
  const newOffset=dashOffset+dir;
  if(newOffset>0)return;
  dashOffset=newOffset;
  renderDashboard();
}

function renderDashboard(){
  const{mon,sun,key}=getCurrentDashWeek();
  const isCurrentWeek=dashOffset===0;
  document.getElementById('dash-week-label').textContent=isCurrentWeek?'This week':'Week of '+fmtD(mon);
  document.getElementById('dash-week-range').textContent=fmtD(mon)+' – '+fmtD(sun);
  document.getElementById('dash-next').style.opacity=isCurrentWeek?'0.3':'1';
  document.getElementById('dash-next').disabled=isCurrentWeek;

  const logs=getLogs().filter(l=>l.week===key);
  const names=['David','Joe','Will','Johannes'];
  names.forEach(name=>{
    const c=CLIENTS[name];
    const cl=logs.filter(l=>l.client===name);
    const hrs=cl.reduce((a,l)=>a+l.hours,0);
    const earn=c.type==='hourly'?c.rate*hrs:(new Set(cl.map(l=>l.week)).size>0?c.rate:0);
    const earnDisp=c.type==='hourly'?`${c.cur}${earn.toFixed(2)}`:(earn>0?`${c.cur}${earn.toLocaleString()}`:'₱0');
    document.getElementById('d-'+name.toLowerCase()).textContent=earnDisp;
    document.getElementById('d-'+name.toLowerCase()+'-sub').textContent=`${hrs} hr${hrs!==1?'s':''}`;
  });

  const dashLogs=document.getElementById('dash-logs');
  if(!logs.length){
    dashLogs.innerHTML='<div class="empty"><i class="ti ti-calendar-off" style="font-size:28px;display:block;margin:0 auto 8px;" aria-hidden="true"></i>No logs for this week.</div>';
    document.getElementById('dash-totals').innerHTML='';
    return;
  }

  const byDay={};
  logs.forEach(l=>{if(!byDay[l.date])byDay[l.date]=[];byDay[l.date].push(l);});
  const days=Object.keys(byDay).sort().reverse();
  let html='<div class="card"><div class="card-title">Logs this week</div><table class="log-table"><thead><tr><th style="width:22%">Date</th><th style="width:18%">Client</th><th style="width:10%">Hrs</th><th style="width:35%">Task</th><th style="width:10%">Amt</th><th style="width:5%"></th></tr></thead><tbody>';
  days.forEach(day=>{
    byDay[day].forEach(l=>{
      const c=CLIENTS[l.client];
      const earn=c.type==='hourly'?`${c.cur}${(l.hours*c.rate).toFixed(2)}`:'Fixed';
      html+=`<tr><td>${fmtD(l.date)}</td><td><span class="badge b-${l.client.toLowerCase()}">${l.client}</span></td><td>${l.hours}</td><td title="${l.desc||''}">${l.desc||'—'}</td><td>${earn}</td><td><button class="del" onclick="deleteLog(${l.id},'dash')" aria-label="Delete"><i class="ti ti-trash" aria-hidden="true"></i></button></td></tr>`;
    });
  });
  html+='</tbody></table></div>';
  dashLogs.innerHTML=html;

  let phpT=0,usdT=0;
  logs.forEach(l=>{const c=CLIENTS[l.client];if(c.type==='fixed'){phpT+=c.rate;}else{usdT+=l.hours*c.rate;}});
  const davidInWeek=logs.filter(l=>l.client==='David').length>0;
  if(davidInWeek)phpT=2000;
  let totHtml='<div style="display:flex;gap:8px;margin-bottom:1rem;">';
  if(phpT>0)totHtml+=`<div class="total-row" style="flex:1;"><span style="font-size:13px;color:var(--color-text-secondary);">PHP total</span><span style="font-weight:500;font-size:16px;">₱${phpT.toLocaleString()}</span></div>`;
  if(usdT>0)totHtml+=`<div class="total-row" style="flex:1;"><span style="font-size:13px;color:var(--color-text-secondary);">USD total</span><span style="font-weight:500;font-size:16px;">$${usdT.toFixed(2)}</span></div>`;
  totHtml+='</div>';
  document.getElementById('dash-totals').innerHTML=totHtml;
}

function deleteLog(id,from){
  if(!confirm('Delete this log?'))return;
  saveLogs(getLogs().filter(l=>l.id!==id));
  if(from==='dash')renderDashboard();
  else renderHistory();
}

function addLog(){
  const date=document.getElementById('log-date').value;
  const client=document.getElementById('log-client').value;
  const hours=parseFloat(document.getElementById('log-hrs').value);
  const desc=document.getElementById('log-desc').value.trim();
  const msg=document.getElementById('log-msg');
  if(!date){msg.className='msg-err';msg.textContent='Please select a date.';return;}
  if(isNaN(hours)||hours<=0){msg.className='msg-err';msg.textContent='Please enter valid hours.';return;}
  const logs=getLogs();
  logs.push({id:Date.now(),date,client,hours,desc,week:weekKey(date)});
  saveLogs(logs);
  document.getElementById('log-hrs').value='';
  document.getElementById('log-desc').value='';
  const c=CLIENTS[client];
  msg.className='msg-ok';
  msg.textContent=c.type==='hourly'?`✓ Logged ${hours} hr(s) for ${client} — ${c.cur}${(hours*c.rate).toFixed(2)} earned`:`✓ Logged ${hours} hr(s) for ${client}`;
  renderDashboard();
}

function renderHistory(){
  const filterClient=document.getElementById('hist-client').value;
  let logs=getLogs();
  if(filterClient!=='all')logs=logs.filter(l=>l.client===filterClient);
  logs.sort((a,b)=>b.date.localeCompare(a.date));

  const el=document.getElementById('history-out');
  if(!logs.length){el.innerHTML='<div class="empty"><i class="ti ti-history" style="font-size:28px;display:block;margin:0 auto 8px;" aria-hidden="true"></i>No logs yet.</div>';return;}

  const byWeek={};
  logs.forEach(l=>{if(!byWeek[l.week])byWeek[l.week]=[];byWeek[l.week].push(l);});
  const weeks=Object.keys(byWeek).sort().reverse();
  let html='';
  weeks.forEach(wk=>{
    const wLogs=byWeek[wk];
    let phpT=0,usdT=0;
    const davidInWeek=wLogs.some(l=>l.client==='David');
    if(davidInWeek)phpT=2000;
    wLogs.forEach(l=>{const c=CLIENTS[l.client];if(c.type==='hourly')usdT+=l.hours*c.rate;});
    const totParts=[];
    if(phpT>0)totParts.push(`₱${phpT.toLocaleString()}`);
    if(usdT>0)totParts.push(`$${usdT.toFixed(2)}`);
    const isCurrentWeek=wk===weekKey(todayStr());
    html+=`<div class="hist-week"><div class="hist-week-hdr" onclick="toggleWeek(this)"><span style="font-size:13px;font-weight:500;">${isCurrentWeek?'This week — ':''}${weekLabel(wk)}</span><span style="font-size:13px;color:var(--color-text-secondary);">${totParts.join(' + ')}</span></div><div class="hist-week-body" style="display:${isCurrentWeek?'block':'none'}"><table class="log-table" style="margin:4px 4px 0;width:calc(100% - 8px);"><thead><tr><th style="width:22%">Date</th><th style="width:18%">Client</th><th style="width:10%">Hrs</th><th style="width:38%">Task</th><th style="width:10%">Amt</th><th style="width:5%"></th></tr></thead><tbody>`;
    wLogs.forEach(l=>{
      const c=CLIENTS[l.client];
      const earn=c.type==='hourly'?`${c.cur}${(l.hours*c.rate).toFixed(2)}`:'Fixed';
      html+=`<tr><td>${fmtD(l.date)}</td><td><span class="badge b-${l.client.toLowerCase()}">${l.client}</span></td><td>${l.hours}</td><td title="${l.desc||''}">${l.desc||'—'}</td><td>${earn}</td><td><button class="del" onclick="deleteLog(${l.id},'hist')" aria-label="Delete"><i class="ti ti-trash" aria-hidden="true"></i></button></td></tr>`;
    });
    html+=`</tbody></table></div></div>`;
  });
  el.innerHTML=html;
}

function toggleWeek(hdr){
  const body=hdr.nextElementSibling;
  body.style.display=body.style.display==='none'?'block':'none';
}

function generateInvoice(){
  const from=document.getElementById('inv-from').value;
  const to=document.getElementById('inv-to').value;
  if(!from||!to){alert('Please set both dates.');return;}
  const logs=getLogs().filter(l=>l.date>=from&&l.date<=to);
  const el=document.getElementById('invoice-out');
  if(!logs.length){el.innerHTML='<div class="empty">No logs found for this period.</div>';return;}
  const invNum='INV-'+Date.now().toString().slice(-6);
  let rows='';let phpT=0,usdT=0;
  ['David','Joe','Will','Johannes'].forEach(name=>{
    const c=CLIENTS[name];
    const cl=logs.filter(l=>l.client===name);
    if(!cl.length)return;
    const hrs=cl.reduce((a,l)=>a+l.hours,0);
    if(c.type==='fixed'){
      const wks=new Set(cl.map(l=>l.week)).size;
      const earn=wks*c.rate;phpT+=earn;
      rows+=`<tr><td style="font-weight:500;">${name}</td><td>Fixed weekly</td><td>${wks} week(s)</td><td>₱2,000/week</td><td style="font-weight:500;">₱${earn.toLocaleString()}</td></tr>`;
    } else {
      const earn=hrs*c.rate;usdT+=earn;
      rows+=`<tr><td style="font-weight:500;">${name}</td><td>Hourly</td><td>${hrs} hrs</td><td>$${c.rate}/hr</td><td style="font-weight:500;">$${earn.toFixed(2)}</td></tr>`;
    }
  });
  let totals='';
  if(phpT>0&&usdT>0){
    totals=`<div style="display:flex;gap:8px;margin-top:1rem;"><div class="total-row" style="flex:1;"><span style="font-size:13px;color:var(--color-text-secondary);">PHP total</span><span style="font-weight:500;font-size:16px;">₱${phpT.toLocaleString()}</span></div><div class="total-row" style="flex:1;"><span style="font-size:13px;color:var(--color-text-secondary);">USD total</span><span style="font-weight:500;font-size:16px;">$${usdT.toFixed(2)}</span></div></div>`;
  } else if(phpT>0){
    totals=`<div class="total-row" style="margin-top:1rem;"><span style="font-size:14px;color:var(--color-text-secondary);">Total</span><span style="font-weight:500;font-size:18px;">₱${phpT.toLocaleString()}</span></div>`;
  } else {
    totals=`<div class="total-row" style="margin-top:1rem;"><span style="font-size:14px;color:var(--color-text-secondary);">Total</span><span style="font-weight:500;font-size:18px;">$${usdT.toFixed(2)}</span></div>`;
  }
  el.innerHTML=`<div class="inv-box">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.25rem;">
      <div><div style="font-size:20px;font-weight:500;">Invoice</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px;">${invNum} · Issued ${fmtD(todayStr())}</div></div>
      <div style="text-align:right;font-size:13px;"><div style="font-weight:500;">Hannah</div><div style="color:var(--color-text-secondary);">Freelance VA</div></div>
    </div>
    <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;font-size:13px;margin-bottom:1rem;">
      <div style="color:var(--color-text-secondary);font-size:11px;margin-bottom:2px;">BILLED TO</div>
      <div style="font-weight:500;">Mary Joy Libed</div>
      <div style="color:var(--color-text-secondary);">Period: ${fmtD(from)} – ${fmtD(to)}</div>
    </div>
    <table class="inv-table"><thead><tr><th>Client</th><th>Type</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table>
    ${totals}
    <div style="margin-top:1rem;font-size:12px;color:var(--color-text-secondary);border-top:0.5px solid var(--color-border-tertiary);padding-top:10px;">Thank you, Mary Joy! Please reach out for any questions.</div>
  </div>`;
}

function goPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.nav-btn')[['dashboard','log','history','invoice'].indexOf(p)].classList.add('active');
  if(p==='dashboard')renderDashboard();
  if(p==='history')renderHistory();
  if(p==='invoice')setInvDefaults();
}

function setInvDefaults(){
  const m=getMonday(todayStr());
  document.getElementById('inv-from').value=m;
  document.getElementById('inv-to').value=addDays(m,6);
}

document.getElementById('today-disp').textContent='Today: '+fmtD(todayStr());
document.getElementById('log-date').value=todayStr();
setInvDefaults();
renderDashboard();
</script>
