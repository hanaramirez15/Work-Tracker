<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hannah's Work Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13; --surface: #18181f; --surface2: #22222d; --border: #2e2e3d;
    --accent: #c8a96e; --accent2: #e8c98a; --text: #f0ede8; --muted: #888;
    --green: #5db87e; --red: #e07070;
    --david: #c8a96e; --will: #7eb8e0; --joe: #a87ee0; --johannes: #7ee0b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .app { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--accent); }
  header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .badge { background: var(--surface2); color: var(--accent); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; border: 1px solid var(--border); }
  .tabs { display: flex; gap: 8px; margin-bottom: 28px; }
  .tab { padding: 10px 24px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; }
  .tab.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .log-section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 28px; }
  .log-section h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 18px; color: var(--accent); }
  .log-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
  label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 6px; }
  select, input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; }
  .btn { padding: 10px 22px; border-radius: 8px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; }
  .btn-primary { background: var(--accent); color: #111; }
  .logs-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .logs-table th { font-size: 0.75rem; color: var(--muted); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .logs-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Work Tracker</h1><p>Hannah Ramirez</p></div>
    <span class="badge" id="total-badge">...</span>
  </header>
  <div class="log-section">
    <h2>Log Hours</h2>
    <div class="log-form">
      <div><label>Client</label><select id="log-client"><option>Johannes</option><option>David</option><option>Will</option><option>Joe</option></select></div>
      <div><label>Date</label><input type="date" id="log-date"></div>
      <div><label>Hours</label><input type="number" id="log-hours" step="0.5"></div>
      <button class="btn btn-primary" onclick="addLog()">Add</button>
    </div>
  </div>
  <div class="log-section">
    <h2>Hours Log</h2>
    <table class="logs-table">
      <thead><tr><th>Date</th><th>Client</th><th>Hours</th></tr></thead>
      <tbody id="logs-body"></tbody>
    </table>
  </div>
</div>

<script>
let logs = JSON.parse(localStorage.getItem('hr_logs')) || [
  { date: '2026-05-18', client: 'Johannes', hours: 15 },
  { date: '2026-05-18', client: 'David', hours: 1 },
  { date: '2026-05-18', client: 'Will', hours: 5 },
  { date: '2026-05-18', client: 'Joe', hours: 5 },
  { date: '2026-05-25', client: 'Johannes', hours: 4 },
  { date: '2026-05-25', client: 'David', hours: 1 },
  { date: '2026-05-25', client: 'Will', hours: 6 },
  { date: '2026-05-25', client: 'Joe', hours: 4 }
];

function save() { localStorage.setItem('hr_logs', JSON.stringify(logs)); render(); }

function addLog() {
  logs.push({
    date: document.getElementById('log-date').value,
    client: document.getElementById('log-client').value,
    hours: parseFloat(document.getElementById('log-hours').value)
  });
  save();
}

function render() {
  document.getElementById('logs-body').innerHTML = logs.map(l => 
    `<tr><td>${l.date}</td><td>${l.client}</td><td>${l.hours} hrs</td></tr>`
  ).join('');
}

document.getElementById('log-date').valueAsDate = new Date();
render();
</script>
</body>
</html>
