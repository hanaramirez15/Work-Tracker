<!DOCTYPE html>
<html>
<head>
    <title>Hannah's Admin Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .tab { display: none; }
        .active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <h2>Admin Dashboard: Client Management</h2>
    <button onclick="showTab('dashboard')">Dashboard</button>
    <button onclick="showTab('clients')">Manage Clients</button>
    <button onclick="showTab('logs')">Log Hours</button>

    <div id="clients" class="tab">
        <h3>Add Client</h3>
        <input id="cName" placeholder="Client Name">
        <input id="cHours" type="number" placeholder="Weekly Hours">
        <input id="cRate" type="number" placeholder="Rate/Hr">
        <button onclick="addClient()">Save Client</button>
        <table id="clientTable">
            <tr><th>Client</th><th>Weekly Hours</th><th>Rate/Hr</th></tr>
        </table>
    </div>

    <div id="logs" class="tab">
        <h3>Log Hours</h3>
        <input id="logDate" type="date">
        <input id="logHours" type="number" placeholder="Hours">
        <button onclick="addLog()">Save Log</button>
    </div>

    <div id="dashboard" class="tab active">
        <h3>Weekly Overview</h3>
        <div id="summary"></div>
    </div>

    <script>
        let clients = JSON.parse(localStorage.getItem('clients')) || [];
        let logs = JSON.parse(localStorage.getItem('logs')) || [];

        function showTab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function addClient() {
            clients.push({name: document.getElementById('cName').value, hours: document.getElementById('cHours').value, rate: document.getElementById('cRate').value});
            localStorage.setItem('clients', JSON.stringify(clients));
            location.reload();
        }

        function addLog() {
            logs.push({date: document.getElementById('logDate').value, hours: document.getElementById('logHours').value});
            localStorage.setItem('logs', JSON.stringify(logs));
            alert("Logged!");
        }

        // Render initial data
        clients.forEach(c => {
            let row = document.getElementById('clientTable').insertRow();
            row.innerHTML = `<td>${c.name}</td><td>${c.hours}</td><td>${c.rate}</td>`;
        });
    </script>
</body>
</html>
